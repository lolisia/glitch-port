# Local development stack for glitch-port.
#
# Only PostgreSQL runs in Docker by default; the Relay, Processor and dashboard
# run on the host (see README.md). The published port matches the connection
# string in collector/src/GlitchPort.Processor/appsettings.Development.json.
#
#   docker compose up -d --wait postgres
#   docker compose down -v            # also drops the anonymous data volume
#
# The `full` profile runs the complete local stack in Docker:
#
#   docker compose --profile full up -d --build --wait
#   docker compose --profile full down -v --remove-orphans
#
# It publishes the Relay on 5080, two processors on 5091/5092 and the dashboard
# on 5173. Both processors share the same PostgreSQL database, so they behave
# like a multi-instance production deployment and can be exercised by
# scripts/e2e-compose.sh.
#
# No named volume is declared: the data is disposable, and `down -v` guarantees
# a clean schema for every `bash scripts/e2e-hello.sh` run.

services:
  # Outside every profile: the integration e2e scripts start the services on
  # the host and only need this database.
  postgres:
    image: postgres:17-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: glitchport
      POSTGRES_PASSWORD: glitchport
      POSTGRES_DB: glitchport
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchport -d glitchport"]
      interval: 2s
      timeout: 5s
      retries: 30

  processor-1:
    profiles: ["full"]
    image: glitch-port-processor:local
    build:
      context: .
      dockerfile: deploy/lightsail/Dockerfile.collector
      args:
        COMPONENT: Processor
    ports:
      - "5091:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=glitchport;Username=glitchport;Password=glitchport;Maximum Pool Size=10"
      Processor__AdminToken: dev-admin-token
      Processor__InternalSharedSecret: dev-internal-secret
      Processor__PublicRelayUrl: http://localhost:5080
      Processor__CorsOrigins__0: http://localhost:5173
      Processor__Bootstrap__Projects__0__Id: 1
      Processor__Bootstrap__Projects__0__Name: Default
      Processor__Bootstrap__Projects__0__Slug: default
      Processor__Bootstrap__Projects__0__PublicKeys__0: dev-public-key
      Processor__Retention__Days: 30
      # The Production image suppresses Microsoft.AspNetCore request logging,
      # but the e2e script asserts that both instances received
      # POST /internal/envelopes, so this category stays at Information.
      Logging__LogLevel__Microsoft.AspNetCore.Hosting.Diagnostics: Information
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  processor-2:
    profiles: ["full"]
    image: glitch-port-processor:local
    build:
      context: .
      dockerfile: deploy/lightsail/Dockerfile.collector
      args:
        COMPONENT: Processor
    ports:
      - "5092:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=glitchport;Username=glitchport;Password=glitchport;Maximum Pool Size=10"
      Processor__AdminToken: dev-admin-token
      Processor__InternalSharedSecret: dev-internal-secret
      Processor__PublicRelayUrl: http://localhost:5080
      Processor__CorsOrigins__0: http://localhost:5173
      Processor__Bootstrap__Projects__0__Id: 1
      Processor__Bootstrap__Projects__0__Name: Default
      Processor__Bootstrap__Projects__0__Slug: default
      Processor__Bootstrap__Projects__0__PublicKeys__0: dev-public-key
      Processor__Retention__Days: 30
      # See processor-1: lets the e2e observe the internal envelope requests.
      Logging__LogLevel__Microsoft.AspNetCore.Hosting.Diagnostics: Information
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  relay:
    profiles: ["full"]
    image: glitch-port-relay:local
    build:
      context: .
      dockerfile: deploy/lightsail/Dockerfile.collector
      args:
        COMPONENT: Relay
    ports:
      - "5080:8080"
    environment:
      # The relay publishes every envelope to one processor, rotating between
      # the two instances, so both processors see traffic.
      Relay__ProcessorEndpoints__0: http://processor-1:8080
      Relay__ProcessorEndpoints__1: http://processor-2:8080
      Relay__InternalSharedSecret: dev-internal-secret
      # Static fallback used until the first Processor project-config refresh
      # succeeds, so ingest works as soon as the relay is healthy.
      Relay__Projects__1__0: dev-public-key
      Relay__ConfigRefreshSeconds: 5
    depends_on:
      processor-1:
        condition: service_healthy
      processor-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  dashboard:
    profiles: ["full"]
    image: glitch-port-dashboard:local
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.dashboard
      args:
        VITE_API_BASE: http://localhost:5091
        VITE_ADMIN_TOKEN: dev-admin-token
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
