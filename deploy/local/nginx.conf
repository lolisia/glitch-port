# Static dashboard server for the local `full` Docker Compose profile.
#
# The React app is a single-page client, so unknown paths fall back to
# index.html. /healthz is answered directly and backs the Compose healthcheck
# (busybox wget is available in nginx:stable-alpine).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
